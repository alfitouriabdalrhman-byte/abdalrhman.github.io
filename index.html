<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مينيو المقهى</title>
</head>
<body>
<h1>☕ مقهى عبدالرحمن الفيتوري</h1>
<p>اختر طلبك بالضغط على الصنف</p>
<p>عدد الأصناف المختارة: <span id="count">0</span></p>
<h2>☕ القهوة</h2>

<div class="item">
  <span class="name">إسبريسو</span>
  <span class="price">5 د</span>
</div>

<div class="item">
  <span class="name">كابتشينو</span>
  <span class="price">7 د</span>
</div>

<div class="item">
  <span class="name">خلطة</span>
  <span class="price">8 د</span>
</div>
<style>
.selected {
  background: #c8e6c9;
  border: 2px solid green;
}
  body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  .item {
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
  }

  .item:hover {
    background: #e0f7fa;
  }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const items = document.querySelectorAll('.item');
  const countSpan = document.getElementById('count');

  function updateCount() {
    const selectedItems = document.querySelectorAll('.item.selected');
    countSpan.textContent = selectedItems.length;
  }

  items.forEach(item => {
    item.addEventListener('click', function () {
      item.classList.toggle('selected');
      updateCount();
    });
  });

});
</script>
</body>
</html>
